name: Lettura quotidiana del Vangelo

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  send-reading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Invia la lettura su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node post-reading.js
